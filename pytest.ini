[pytest]
# Direct-mode tests for the Stasis Protocol Intelligent Contracts.
# The genlayer-test (gltest) pytest plugin provides direct_vm/direct_deploy fixtures.
testpaths = tests/direct
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Disable an unrelated, environment-installed plugin (hydra_pytest) that is
# incompatible with Python 3.14 (imports the removed typing.io). The GenLayer
# direct-mode plugins (gltest, gltest_direct) load normally.
addopts = -ra -p no:hydra_pytest
